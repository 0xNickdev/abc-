name: aitrader CI

on:
  push:
    paths: ["aitrader/**", ".github/workflows/aitrader-ci.yml"]
  pull_request:
    paths: ["aitrader/**", ".github/workflows/aitrader-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aitrader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Test (pytest)
        run: pytest -q
